name: "AI Blog Pipeline — generate + SEO/GEO optimize"
description: >-
  The full loop in one step: generates one non-duplicating road-trip blog post
  (roadtrip-blogger agent), immediately optimizes it for SEO and GEO
  (blog-seo-geo skill over the aaron-marketing pack), and opens a single pull
  request with the born-optimized post. Never pushes to your default branch.
author: cazerme
branding:
  icon: refresh-cw
  color: orange

inputs:
  anthropic_api_key:
    description: "Anthropic API key (or use claude_code_oauth_token instead)"
    required: false
    default: ""
  claude_code_oauth_token:
    description: "Claude Code OAuth token from `claude setup-token` — bills your Claude subscription instead of API credits. Takes precedence when both are set."
    required: false
    default: ""
  github_token:
    description: "Token used to push the branch and open the PR"
    required: false
    default: ${{ github.token }}
  topic:
    description: "Optional route/topic for the post; omit to let the agent pick the best uncovered topic"
    required: false
    default: ""
  model:
    description: "Optional model override passed to Claude Code"
    required: false
    default: ""
  create_pr:
    description: "Open a pull request with the result"
    required: false
    default: "true"
  base_branch:
    description: "Base branch for the PR"
    required: false
    default: ${{ github.event.repository.default_branch }}
  working_directory:
    description: "Directory of the blog (for monorepos)"
    required: false
    default: "."
  push_branch:
    description: "Push the result branch to origin (set 'false' for self-tests)"
    required: false
    default: "true"
  plugin_ref:
    description: "Marketplace source for the blog-marketing plugin"
    required: false
    default: "cazerme/blog-marketing-skills"
  aaron_ref:
    description: "Marketplace source for the aaron-marketing plugin"
    required: false
    default: "aaron-he-zhu/aaron-marketing-skills"
  aaron_version:
    description: "aaron-marketing version to install (git tag v<version> of aaron_ref). Defaults to the playbook-tested baseline; set '' to install latest (unpinned)."
    required: false
    default: "19.0.0"
  illustrate:
    description: "Add images after the SEO/GEO pass (Waybox's blog-smart-images skill), so the single PR carries a post that is written, optimized and illustrated. Off by default: it needs a stock photo key and spends extra tokens on visual scoring."
    required: false
    default: "false"
  images_dir:
    description: "Where exported images land, relative to working_directory. Empty lets the skill default to images/<post-slug>/ next to the post."
    required: false
    default: ""
  max_figures:
    description: "Cap on inline figures besides hero/OG (illustrate only)"
    required: false
    default: "4"
  image_style:
    description: "Style preset id for the image pass (livelike-warm, natgeo-doc, vanlife-film, kinfolk-minimal, parks-golden-west, ig-editorial)"
    required: false
    default: ""
  pexels_api_key:
    description: "Pexels key — the primary stock photo source for the image pass. Without any stock key the skill leaves photo slots empty rather than padding the post with text cards."
    required: false
    default: ""
  unsplash_access_key:
    description: "Unsplash key — backup stock source for the image pass"
    required: false
    default: ""
  install_card_renderer:
    description: "Install Playwright + Chromium for the brand card renderer (~300 MB). Photo heroes and photo-derived OG crops do not need it."
    required: false
    default: "false"
  image_skill_repo:
    description: "Source repository for the blog-smart-images skill"
    required: false
    default: "Zora-waybox/blog-image-skill"
  image_skill_ref:
    description: "Git ref of image_skill_repo to install. Defaults to main because HTML support is not in a release yet — v0.1.1 and earlier are Markdown-only."
    required: false
    default: "main"

outputs:
  post_file:
    description: "Path of the generated (and optimized) post file"
    value: ${{ steps.collect.outputs.post_file }}
  branch:
    description: "Branch containing the result"
    value: ${{ steps.collect.outputs.branch }}
  pr_url:
    description: "URL of the opened pull request (empty when create_pr is false)"
    value: ${{ steps.pr.outputs.pr_url }}

runs:
  using: composite
  steps:
    - name: Install Claude Code CLI
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code
        claude --version

    - name: Install the plugins
      shell: bash
      run: |
        AARON_REF="${{ inputs.aaron_ref }}"
        AARON_VERSION="${{ inputs.aaron_version }}"
        if [ -n "$AARON_VERSION" ]; then
          # Pin to the playbook-tested version: clone upstream at its release
          # tag and register the clone as a local marketplace.
          case "$AARON_REF" in
            *://*) AARON_URL="$AARON_REF" ;;
            *)     AARON_URL="https://github.com/$AARON_REF" ;;
          esac
          git clone --quiet --depth 1 --branch "v$AARON_VERSION" "$AARON_URL" "$RUNNER_TEMP/aaron-marketing-pinned"
          claude plugin marketplace add "$RUNNER_TEMP/aaron-marketing-pinned"
        else
          claude plugin marketplace add "$AARON_REF"
        fi
        claude plugin install aaron-marketing@aaron --scope user
        claude plugin marketplace add "${{ inputs.plugin_ref }}"
        claude plugin install blog-marketing@blog-marketing-skills --scope user

    - name: Generate the post (roadtrip-blogger agent)
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        IN_API_KEY: ${{ inputs.anthropic_api_key }}
        IN_OAUTH: ${{ inputs.claude_code_oauth_token }}
      run: |
        if [ -n "$IN_OAUTH" ]; then
          export CLAUDE_CODE_OAUTH_TOKEN="$IN_OAUTH"
        elif [ -n "$IN_API_KEY" ]; then
          export ANTHROPIC_API_KEY="$IN_API_KEY"
        else
          echo "::error::Provide anthropic_api_key or claude_code_oauth_token"; exit 1
        fi
        MODEL_ARG=""
        if [ -n "${{ inputs.model }}" ]; then MODEL_ARG="--model ${{ inputs.model }}"; fi
        TOPIC_LINE=""
        if [ -n "${{ inputs.topic }}" ]; then TOPIC_LINE="Requested topic/keyword: ${{ inputs.topic }}."; fi
        claude -p "Use the roadtrip-blogger agent to generate exactly one new blog post for this repository. ${TOPIC_LINE} Follow the agent's workflow completely. Do not commit — git is handled outside. Finish by printing the agent's handoff report." \
          $MODEL_ARG \
          --allowedTools "Agent,Task,Bash,Read,Write,Edit,Grep,Glob,WebSearch,WebFetch" \
          --max-turns 100

    - name: Locate the generated post
      id: collect
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        POST_FILE=$(git status --porcelain | awk '$1 == "??" && $2 ~ /\.(html|md|markdown)$/ && $2 !~ /coverage/ {print $2; exit}')
        if [ -z "$POST_FILE" ]; then
          echo "::error::No generated post found — the agent likely stopped at a gate (see log above)."
          exit 1
        fi
        echo "post_file=${POST_FILE}" >> "$GITHUB_OUTPUT"
        echo "branch=blog/daily-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

    - name: Optimize the post (blog-seo-geo skill)
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        IN_API_KEY: ${{ inputs.anthropic_api_key }}
        IN_OAUTH: ${{ inputs.claude_code_oauth_token }}
      run: |
        if [ -n "$IN_OAUTH" ]; then
          export CLAUDE_CODE_OAUTH_TOKEN="$IN_OAUTH"
        elif [ -n "$IN_API_KEY" ]; then
          export ANTHROPIC_API_KEY="$IN_API_KEY"
        else
          echo "::error::Provide anthropic_api_key or claude_code_oauth_token"; exit 1
        fi
        MODEL_ARG=""
        if [ -n "${{ inputs.model }}" ]; then MODEL_ARG="--model ${{ inputs.model }}"; fi
        claude -p "/blog-marketing:blog-seo-geo ${{ steps.collect.outputs.post_file }}" \
          $MODEL_ARG \
          --allowedTools "Skill,Bash,Read,Write,Edit,Grep,Glob,WebSearch,WebFetch" \
          --max-turns 100

    - name: Install the image skill and its dependencies
      if: ${{ inputs.illustrate == 'true' }}
      shell: bash
      env:
        SKILL_REPO: ${{ inputs.image_skill_repo }}
        SKILL_REF: ${{ inputs.image_skill_ref }}
      run: |
        # User-scoped, not a plugin marketplace: upstream ships no
        # .claude-plugin/marketplace.json, and a .claude/ directory inside the
        # blog repo would be swept into the `git add -A` commit below.
        case "$SKILL_REPO" in
          *://*) SKILL_URL="$SKILL_REPO" ;;
          *)     SKILL_URL="https://github.com/$SKILL_REPO" ;;
        esac
        git clone --quiet --depth 1 --branch "$SKILL_REF" "$SKILL_URL" "$RUNNER_TEMP/blog-image-skill"
        mkdir -p "$HOME/.claude/skills"
        rm -rf "$HOME/.claude/skills/blog-smart-images"
        cp -r "$RUNNER_TEMP/blog-image-skill/skills/blog-smart-images" "$HOME/.claude/skills/"
        python3 -m pip install --quiet --upgrade pillow
        if [ "${{ inputs.install_card_renderer }}" = "true" ]; then
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
        fi
        # The generated post is HTML or Markdown depending on the blog; fail
        # fast rather than let a Markdown-only build silently insert nothing.
        case "${{ steps.collect.outputs.post_file }}" in
          *.html|*.htm)
            if [ ! -f "$HOME/.claude/skills/blog-smart-images/scripts/htmlpost.py" ]; then
              echo "::error::The generated post is HTML, but the installed blog-smart-images has no HTML support. v0.1.1 and earlier are Markdown-only — set image_skill_ref to a ref that includes it (main, currently)."
              exit 1
            fi
            ;;
        esac

    - name: Illustrate the post (blog-smart-images skill)
      if: ${{ inputs.illustrate == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        IN_API_KEY: ${{ inputs.anthropic_api_key }}
        IN_OAUTH: ${{ inputs.claude_code_oauth_token }}
        PEXELS_API_KEY: ${{ inputs.pexels_api_key }}
        UNSPLASH_ACCESS_KEY: ${{ inputs.unsplash_access_key }}
      run: |
        if [ -n "$IN_OAUTH" ]; then
          export CLAUDE_CODE_OAUTH_TOKEN="$IN_OAUTH"
        elif [ -n "$IN_API_KEY" ]; then
          export ANTHROPIC_API_KEY="$IN_API_KEY"
        else
          echo "::error::Provide anthropic_api_key or claude_code_oauth_token"; exit 1
        fi
        if [ -z "$PEXELS_API_KEY" ] && [ -z "$UNSPLASH_ACCESS_KEY" ]; then
          echo "::warning::No stock photo key set. The skill refuses to pad a post with text cards, so photo slots will be left empty and this pass may insert nothing."
        fi
        MODEL_ARG=""
        if [ -n "${{ inputs.model }}" ]; then MODEL_ARG="--model ${{ inputs.model }}"; fi
        ARGS="${{ steps.collect.outputs.post_file }}"
        if [ -n "${{ inputs.images_dir }}" ]; then ARGS="$ARGS --images-dir ${{ inputs.images_dir }}"; fi
        if [ -n "${{ inputs.max_figures }}" ]; then ARGS="$ARGS --max-figures ${{ inputs.max_figures }}"; fi
        STYLE_LINE=""
        if [ -n "${{ inputs.image_style }}" ]; then
          STYLE_LINE="Use the '${{ inputs.image_style }}' style preset."
        fi
        claude -p "Run the blog-smart-images skill on ${ARGS}. ${STYLE_LINE} Follow its SKILL.md exactly, including the licensing rules, the scoring gates, and the insert-only write path. Do not commit — git is handled outside." \
          $MODEL_ARG \
          --allowedTools "Skill,Bash,Read,Write,Edit,Grep,Glob,WebSearch,WebFetch" \
          --max-turns 100

    - name: Harvest the report, drop runner-only artifacts
      id: report
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        BODY="$RUNNER_TEMP/pr-body.md"
        REPORT=$(find . -path '*/.seo-optimizer/reports/*.md' | head -1 || true)
        if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
          cp "$REPORT" "$BODY"
        else
          echo "Generated and optimized by the AI Blog Pipeline — see the action run log for both reports." > "$BODY"
        fi
        IMG_REPORT="${{ steps.collect.outputs.post_file }}.image-report.md"
        if [ -f "$IMG_REPORT" ]; then
          { echo ""; echo "---"; echo ""; cat "$IMG_REPORT"; } >> "$BODY"
        fi
        {
          echo ""
          echo "---"
          if [ "${{ inputs.illustrate }}" = "true" ]; then
            echo "One post, born optimized and illustrated: generated by roadtrip-blogger, passed through"
            echo "blog-seo-geo, then illustrated by blog-smart-images. Prose is untouched by the image pass"
            echo "by construction — it only inserts. Check the licence column before merging."
          else
            echo "One post, born optimized: generated by roadtrip-blogger, then passed through blog-seo-geo."
          fi
          echo "Review the perishable-claims table in the generation report (action run log) before merging."
        } >> "$BODY"
        # backups/reports are runner-only artifacts — never ship them in the PR.
        # The exported images are deliverables and are deliberately kept.
        find . -type d -name '.seo-optimizer' -exec rm -rf {} +
        rm -f "$IMG_REPORT" "${{ steps.collect.outputs.post_file }}.bak"
        find . -name '*.preview.html' -delete
        find . -maxdepth 2 \( -name 'image-plan.json' -o -name 'insert-plan.json' \) -delete
        rm -rf candidates raw
        echo "body=${BODY}" >> "$GITHUB_OUTPUT"

    - name: Commit to a branch
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        git config user.name "blog-marketing-action[bot]"
        git config user.email "blog-marketing-action[bot]@users.noreply.github.com"
        git switch -c "${{ steps.collect.outputs.branch }}"
        git add -A
        git commit -m "blog: new optimized post via pipeline (${{ steps.collect.outputs.post_file }})"
        if [ "${{ inputs.push_branch }}" = "true" ]; then
          git push -u origin "${{ steps.collect.outputs.branch }}"
        else
          echo "push_branch=false — commit left local (self-test mode)"
        fi

    - name: Open the pull request
      id: pr
      if: ${{ inputs.create_pr == 'true' && inputs.push_branch == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        PR_URL=$(gh pr create \
          --base "${{ inputs.base_branch }}" \
          --head "${{ steps.collect.outputs.branch }}" \
          --title "blog: new optimized post — ${{ steps.collect.outputs.post_file }}" \
          --body-file "${{ steps.report.outputs.body }}")
        echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
